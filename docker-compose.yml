services:
  web:
    build: .
    container_name: doubletruble_web
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - .env
  db:
    image: postgres:17
    container_name: doubletruble_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}